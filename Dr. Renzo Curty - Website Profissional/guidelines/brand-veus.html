<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);padding:18px 22px;height:260px;box-sizing:border-box}
.lbl{font-family:var(--font-mono);font-size:8.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-faint)}
.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.2px}

</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div style="position:relative;overflow:hidden;height:190px">
<img src="../assets/grupo5.jpeg" style="width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block">
<div style="position:absolute;inset:0;background:var(--scrim-bottom)"></div>
<div style="position:absolute;bottom:0;padding:16px 18px;color:var(--rc-creme)"><div class="lbl" style="color:var(--accent-label-dark)">Padrão</div><div style="font-family:var(--font-display);font-size:20px;margin-top:6px">--scrim-bottom</div></div>
</div>
<div style="position:relative;overflow:hidden;height:190px">
<img src="../assets/grupo1.jpeg" style="width:100%;height:100%;object-fit:cover;display:block">
<div style="position:absolute;inset:0;background:var(--scrim-bottom-strong)"></div>
<div style="position:absolute;bottom:0;padding:16px 18px;color:var(--rc-creme)"><div class="lbl" style="color:var(--accent-label-dark)">Texto longo</div><div style="font-family:var(--font-display);font-size:20px;margin-top:6px">--scrim-bottom-strong</div></div>
</div>
</div></body></html>
