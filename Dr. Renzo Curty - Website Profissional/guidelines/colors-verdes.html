<!-- @dsCard group="Colors" viewport="700x180" name="Verdes" subtitle="Musgo é a cor de marca; o 800 é a superfície escura padrão" -->
<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);padding:18px 22px;height:180px;box-sizing:border-box}
.lbl{font-family:var(--font-mono);font-size:8.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-faint)}
.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.2px}

</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px">
<div style="display:flex;flex-direction:column">
<div style="height:64px;background:var(--rc-verde-900)"></div>
<div style="padding:9px 0 0"><div style="font-size:12px;font-weight:600">Verde 900</div>
<div class="hex" style="color:var(--text-faint);margin-top:3px">#131A0E</div></div></div>
<div style="display:flex;flex-direction:column">
<div style="height:64px;background:var(--rc-verde-800)"></div>
<div style="padding:9px 0 0"><div style="font-size:12px;font-weight:600">Verde 800</div>
<div class="hex" style="color:var(--text-faint);margin-top:3px">#1E2617</div></div></div>
<div style="display:flex;flex-direction:column">
<div style="height:64px;background:var(--rc-verde-600)"></div>
<div style="padding:9px 0 0"><div style="font-size:12px;font-weight:600">Verde 600</div>
<div class="hex" style="color:var(--text-faint);margin-top:3px">#3F4B2C</div></div></div>
<div style="display:flex;flex-direction:column">
<div style="height:64px;background:var(--rc-verde-500)"></div>
<div style="padding:9px 0 0"><div style="font-size:12px;font-weight:600">Musgo 500</div>
<div class="hex" style="color:var(--text-faint);margin-top:3px">#55663D</div></div></div>
<div style="display:flex;flex-direction:column">
<div style="height:64px;background:var(--rc-salvia-400)"></div>
<div style="padding:9px 0 0"><div style="font-size:12px;font-weight:600">Sálvia 400</div>
<div class="hex" style="color:var(--text-faint);margin-top:3px">#A8B292</div></div></div>
<div style="display:flex;flex-direction:column">
<div style="height:64px;background:var(--rc-salvia-300)"></div>
<div style="padding:9px 0 0"><div style="font-size:12px;font-weight:600">Sálvia 300</div>
<div class="hex" style="color:var(--text-faint);margin-top:3px">#C3CBAE</div></div></div>
</div></body></html>
