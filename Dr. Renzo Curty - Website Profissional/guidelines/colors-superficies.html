<!-- @dsCard group="Colors" viewport="700x210" name="Ritmo de superfícies" subtitle="A página alterna creme, areia e verde escuro; no máximo dois fundos claros" -->
<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);padding:18px 22px;height:210px;box-sizing:border-box}
.lbl{font-family:var(--font-mono);font-size:8.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-faint)}
.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.2px}

</style></head><body><div style="display:flex;flex-direction:column;gap:0;border:1px solid var(--border-hairline)">
<div style="background:var(--surface-dark);color:var(--text-on-dark);padding:16px 18px;display:flex;justify-content:space-between"><span style="font-family:var(--font-display);font-size:18px">Hero · verde 800</span><span class="hex" style="color:var(--text-on-dark-faint)">--surface-dark</span></div>
<div style="background:var(--surface-alt);padding:14px 18px;display:flex;justify-content:space-between"><span style="font-size:13px">Faixa de instituições · areia</span><span class="hex" style="color:var(--text-faint)">--surface-alt</span></div>
<div style="background:var(--surface-page);padding:14px 18px;display:flex;justify-content:space-between"><span style="font-size:13px">Seção de conteúdo · creme</span><span class="hex" style="color:var(--text-faint)">--surface-page</span></div>
<div style="background:var(--surface-deep);color:var(--text-on-dark);padding:16px 18px;display:flex;justify-content:space-between"><span style="font-family:var(--font-display);font-size:18px">Seção de contraste · verde 900</span><span class="hex" style="color:var(--text-on-dark-faint)">--surface-deep</span></div>
</div></body></html>
