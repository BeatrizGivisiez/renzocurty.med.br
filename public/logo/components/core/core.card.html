<!-- @dsCard group="Components" viewport="700x330" name="Core" subtitle="Botão, rótulo de seção, selo de status e etiqueta" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body)}</style></head>
<body><div id="r"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../ds-fallback.js"></script>
<script src="../../_ds_bundle.js" onerror="void 0"></script>
<script type="text/jsx" id="rc-app">
const NS = (function () {
  var fb = window.RCFallback || {};
  var ns = null, keys = [];
  try { keys = Object.keys(window); } catch (e) {}
  for (var i = 0; i < keys.length; i++) {
    try {
      var v = window[keys[i]];
      if (!v || typeof v !== 'object' || v === fb) continue;
      if (v.self === v || v.window === v) continue;          // frames
      if (v.Button || v.RoleCard || v.SectionHeading || v.TextField || v.ImageCard) { ns = v; break; }
    } catch (e) { /* propriedade cross-origin: ignora */ }
  }
  return Object.assign({}, fb, ns || {});
})();
const { Button, Eyebrow, StatusBadge, Chip } = NS;
const Row = ({label, children}) => (
  <div style={{display:'grid',gridTemplateColumns:'96px minmax(0,1fr)',gap:18,alignItems:'center',padding:'14px 0',borderTop:'1px solid var(--border-hairline)'}}>
    <span style={{fontFamily:'var(--font-mono)',fontSize:9,letterSpacing:'1.4px',textTransform:'uppercase',color:'var(--text-faint)'}}>{label}</span>
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>{children}</div>
  </div>
);
ReactDOM.createRoot(document.getElementById('r')).render(
  <div style={{padding:'20px 24px'}}>
    <div style={{background:'var(--surface-dark)',padding:'20px 22px',display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
      <Button variant="primary" size="md">Agendar consulta</Button>
      <Button variant="secondary" size="md">Ver trajetória</Button>
      <Button variant="primary" size="sm">Contato</Button>
    </div>
    <Row label="Sobre claro"><Button variant="onLight">Enviar</Button><Button variant="ghost">Currículo</Button><Button variant="ghost" disabled>Indisponível</Button></Row>
    <Row label="Rótulo"><Eyebrow number="04">Áreas remotas</Eyebrow></Row>
    <Row label="Status"><StatusBadge active>Ativo</StatusBadge><StatusBadge>Concluído</StatusBadge></Row>
    <Row label="Etiqueta"><Chip>Medicina</Chip><Chip>Gestão em saúde</Chip><Chip selected>Educação médica</Chip></Row>
  </div>
);
</script>
<script>
(function () {
  var src = document.getElementById('rc-app').textContent;
  var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]], sourceType: 'script' }).code;
  new Function(out)();
})();
</script></body></html>
