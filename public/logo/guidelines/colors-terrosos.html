<!-- @dsCard group="Colors" viewport="700x180" name="Terrosos e neutros quentes" subtitle="Marrom só em rótulo; creme e areia são as duas superfícies claras" -->
<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);padding:18px 22px;height:180px;box-sizing:border-box}
.lbl{font-family:var(--font-mono);font-size:8.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-faint)}
.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.2px}

</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">
<div style="display:flex;flex-direction:column">
<div style="height:64px;background:var(--rc-marrom-600)"></div>
<div style="padding:9px 0 0"><div style="font-size:12px;font-weight:600">Marrom 600</div>
<div class="hex" style="color:var(--text-faint);margin-top:3px">#8A5A3B</div></div></div>
<div style="display:flex;flex-direction:column">
<div style="height:64px;background:var(--rc-ink)"></div>
<div style="padding:9px 0 0"><div style="font-size:12px;font-weight:600">Ink</div>
<div class="hex" style="color:var(--text-faint);margin-top:3px">#191C13</div></div></div>
<div style="display:flex;flex-direction:column">
<div style="height:64px;background:var(--rc-creme)"></div>
<div style="padding:9px 0 0"><div style="font-size:12px;font-weight:600">Creme</div>
<div class="hex" style="color:var(--text-faint);margin-top:3px">#F5F1E8</div></div></div>
<div style="display:flex;flex-direction:column">
<div style="height:64px;background:var(--rc-areia)"></div>
<div style="padding:9px 0 0"><div style="font-size:12px;font-weight:600">Areia</div>
<div class="hex" style="color:var(--text-faint);margin-top:3px">#EDE6D8</div></div></div>
<div style="display:flex;flex-direction:column">
<div style="height:64px;background:var(--rc-areia-800)"></div>
<div style="padding:9px 0 0"><div style="font-size:12px;font-weight:600">Areia 800</div>
<div class="hex" style="color:var(--text-faint);margin-top:3px">#E8E2D5</div></div></div>
</div></body></html>
