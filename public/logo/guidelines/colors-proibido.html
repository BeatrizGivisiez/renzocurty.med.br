<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);padding:18px 22px;height:170px;box-sizing:border-box}
.lbl{font-family:var(--font-mono);font-size:8.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-faint)}
.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.2px}

</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div><div style="height:60px;background:#C9A227;position:relative;opacity:.55"><div style="position:absolute;inset:0;background:linear-gradient(135deg,transparent 47%,var(--rc-ink) 47%,var(--rc-ink) 53%,transparent 53%)"></div></div><div style="padding-top:9px"><div style="font-size:12px;font-weight:600;color:var(--text-muted)">Dourado</div><div class="hex" style="color:var(--text-faint);margin-top:3px">#C9A227</div></div></div><div><div style="height:60px;background:#7CFFB2;position:relative;opacity:.55"><div style="position:absolute;inset:0;background:linear-gradient(135deg,transparent 47%,var(--rc-ink) 47%,var(--rc-ink) 53%,transparent 53%)"></div></div><div style="padding-top:9px"><div style="font-size:12px;font-weight:600;color:var(--text-muted)">Neon</div><div class="hex" style="color:var(--text-faint);margin-top:3px">#7CFFB2</div></div></div><div><div style="height:60px;background:#F7C8D8;position:relative;opacity:.55"><div style="position:absolute;inset:0;background:linear-gradient(135deg,transparent 47%,var(--rc-ink) 47%,var(--rc-ink) 53%,transparent 53%)"></div></div><div style="padding-top:9px"><div style="font-size:12px;font-weight:600;color:var(--text-muted)">Pastel</div><div class="hex" style="color:var(--text-faint);margin-top:3px">#F7C8D8</div></div></div><div><div style="height:60px;background:#6B4FE0;position:relative;opacity:.55"><div style="position:absolute;inset:0;background:linear-gradient(135deg,transparent 47%,var(--rc-ink) 47%,var(--rc-ink) 53%,transparent 53%)"></div></div><div style="padding-top:9px"><div style="font-size:12px;font-weight:600;color:var(--text-muted)">Violeta</div><div class="hex" style="color:var(--text-faint);margin-top:3px">#6B4FE0</div></div></div>
</div>
<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border-hairline);font-size:12.5px;line-height:1.5;color:var(--text-muted)">Substitutos: sálvia 400 sobre escuro, marrom 600 sobre claro, creme no botão primário.</div></body></html>
