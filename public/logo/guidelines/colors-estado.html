<!-- @dsCard group="Colors" viewport="700x150" name="Estado e seleção" subtitle="Verde-claro para ativo, cinza para encerrado, sálvia para seleção de texto" -->
<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0}
body{background:var(--surface-page);color:var(--text-primary);font-family:var(--font-body);padding:18px 22px;height:150px;box-sizing:border-box}
.lbl{font-family:var(--font-mono);font-size:8.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-faint)}
.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.2px}

</style></head><body><div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap">
<span style="display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;padding:6px 11px;border:1px solid rgba(85,102,61,.45);background:rgba(85,102,61,.12)"><span style="width:5px;height:5px;border-radius:50%;background:var(--status-active)"></span>Ativo</span>
<span style="display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;padding:6px 11px;border:1px solid var(--border-hairline-strong);color:rgba(25,28,19,.55)"><span style="width:5px;height:5px;border-radius:50%;background:var(--status-done)"></span>Concluído</span>
<span style="font-size:14px">Seleção: <span style="background:var(--selection-bg);color:var(--selection-fg);padding:1px 3px">texto marcado</span></span>
<span style="font-size:14px">Link: <a href="#" style="color:var(--rc-verde-500)">normal</a> · <a href="#" style="color:var(--accent-link-hover)">hover</a></span>
</div></body></html>
